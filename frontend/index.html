    <script>
      // Default = light; only apply dark when user previously chose it
      try {
        if (localStorage.getItem('shwe_gold_theme_v2') === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (_) {}
